
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-arc-sa
  namespace: examples
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: examples
  name: github-arc-role
rules:
- apiGroups: [""] # "" indicates the core API group
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
- apiGroups: [""] # "" indicates the core API group
  resources: ["secrets"]
  verbs: ["get"]
- apiGroups: [""] # "" indicates the core API group
  resources: ["configMaps"]
  verbs: ["get", "list"]
---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-arc-rb
  namespace: examples
subjects:
- kind: ServiceAccount
  name: github-arc-sa # "name" is case sensitive
  namespace: examples
roleRef:
  # "roleRef" specifies the binding to a Role / ClusterRole
  kind: Role 
  name: github-arc-role 
  apiGroup: rbac.authorization.k8s.io

